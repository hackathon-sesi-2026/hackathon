[project]
name = "selo-saude-api"
version = "0.1.0"
description = "API do Selo Saúde: engajamento na APS do SESI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]
qa = ["pytest>=8.3", "playwright>=1.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selo_saude"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Depends() em valor padrão é o idioma do FastAPI
